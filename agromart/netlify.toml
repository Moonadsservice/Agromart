# Netlify configuration for AgroMart

[build]
  # The base directory is the root of the repository.
  # The build command creates a `dist` directory and copies all files
  # from `src` and `public` into it. This makes all assets available
  # from a single publish directory.
  command = "mkdir -p dist && cp -r src/. dist/ && cp -r public/. dist/"
  publish = "dist"
  functions = "netlify/functions"

# Settings for Netlify Functions
[functions]
  # Use esbuild for faster function bundling.
  node_bundler = "esbuild"

# Redirect rule for serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirect rule for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
