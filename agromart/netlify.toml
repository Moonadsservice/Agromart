# Netlify configuration for AgroMart

[build]
  # This command assumes it is run from the repository root, where the `src`
  # and `public` directories are located.
  command = "mkdir -p dist && cp -r src/. dist/ && cp -r public/. dist/"
  publish = "dist"
  functions = "netlify/functions"

# Settings for Netlify Functions
[functions]
  # Use esbuild for faster function bundling.
  node_bundler = "esbuild"

# Redirect rule for serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirect rule for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
