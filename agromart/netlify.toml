# Netlify configuration for AgroMart

[build]
  # The build command and paths are relative to the repository root.
  # This configuration is for a project located in the `agromart` subdirectory.
  command = "mkdir -p agromart/dist && cp -r agromart/src/. agromart/dist/ && cp -r agromart/public/. agromart/dist/"
  publish = "agromart/dist"
  functions = "agromart/netlify/functions"

# Settings for Netlify Functions
[functions]
  # Use esbuild for faster function bundling.
  node_bundler = "esbuild"

# Redirect rule for serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirect rule for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
