<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroMart</title>
    <meta name="description" content="An Amazon-style Agriculture Store">

    <!-- PWA Meta -->
    <meta name="theme-color" content="#4CAF50"/>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- App Scripts -->
    <script type="module" src="main.js"></script>
</head>
<body class="bg-gray-100">

    <div id="app" class="container mx-auto p-4">
        <!-- Header -->
        <header class="flex justify-between items-center bg-white p-4 rounded-lg shadow mb-4">
            <h1 class="text-3xl font-bold text-green-700">AgroMart</h1>
            <nav>
                <button id="cart-button" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">View Cart (0)</button>
                <button id="auth-button" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 ml-2">Login</button>
            </nav>
        </header>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Product Listing Page -->
            <div id="product-listing-page">
                <h2 class="text-2xl font-semibold mb-4">Products</h2>
                <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Product cards will be inserted here by main.js -->
                </div>
            </div>

            <!-- Cart Page (hidden by default) -->
            <div id="cart-page" class="hidden bg-white p-6 rounded-lg shadow">
                <!-- Cart content will be inserted here -->
            </div>

            <!-- Checkout Page (hidden by default) -->
            <div id="checkout-page" class="hidden bg-white p-6 rounded-lg shadow">
                <!-- Checkout form will be inserted here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="mt-8 p-6 bg-white rounded-lg shadow">
            <h3 class="text-xl font-semibold mb-4">Become a Supplier</h3>
            <form name="supplier" method="POST" data-netlify="true">
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" name="name" placeholder="Your Name" class="p-2 border rounded flex-grow" required />
                    <input type="email" name="email" placeholder="Your Email" class="p-2 border rounded flex-grow" required />
                    <textarea name="message" placeholder="Tell us about your products" class="p-2 border rounded flex-grow" required></textarea>
                    <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600">Submit</button>
                </div>
            </form>
        </footer>

        <!-- Auth Modal (hidden by default) -->
        <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm">
                <h2 id="auth-title" class="text-2xl font-bold mb-4">Login</h2>
                <form id="auth-form">
                    <div id="fullname-field" class="mb-4 hidden">
                        <label for="full_name" class="block text-gray-700">Full Name</label>
                        <input type="text" id="full_name" name="full_name" class="w-full p-2 border rounded">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700">Email</label>
                        <input type="email" id="email" name="email" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block text-gray-700">Password</label>
                        <input type="password" id="password" name="password" class="w-full p-2 border rounded" required>
                    </div>
                    <p id="auth-error" class="text-red-500 mb-4"></p>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Login</button>
                </form>
                <p class="text-center mt-4">
                    <a href="#" id="auth-toggle-link">Don't have an account? Sign Up</a>
                </p>
                <button id="auth-close-button" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800">&times;</button>
            </div>
        </div>
    </div>

</body>
</html>
